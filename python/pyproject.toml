[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-kernels"
version = "0.1.1"
description = "Metal kernel sources for Apple silicon. The collection currently has FlashAttention for head dim 32."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "John Amodeo" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Environment :: MacOS X",
    "Environment :: GPU",
    "Topic :: Scientific/Engineering",
]
keywords = ["metal", "gpu", "apple", "apple-silicon", "mlx", "pytorch-mps"]

[project.urls]
Homepage = "https://github.com/jmamodeo/metal-kernels"
Repository = "https://github.com/jmamodeo/metal-kernels"
Issues = "https://github.com/jmamodeo/metal-kernels/issues"

# Optional hosts. The loader does not import them.
# mlx publishes Apple silicon wheels. PyTorch MPS is macOS-only.
[project.optional-dependencies]
mlx = ["mlx"]
torch = ["torch"]
reference = ["numpy>=1.24"]
dev = ["numpy>=1.24", "pytest>=7", "build"]
# Mac-only. mlx and the default PyTorch wheel have no Linux MPS build.
# NumPy is required: without it PyTorch warns "Failed to initialize NumPy"
# and the shape profiler cannot import it. pytest runs the metal tests in
# bench/run_mac.sh.
mac = ["torch", "mlx", "numpy>=1.24", "pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
metal_kernels = ["kernels/**/*"]

# scaffolding only; not a shipped kernel
[tool.setuptools.exclude-package-data]
metal_kernels = ["kernels/_template", "kernels/_template/**"]
