[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metal-kernels"
version = "0.0.0"
description = "Locate Metal kernel sources for the metal-kernels collection. No kernels are included yet."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
]
keywords = ["metal", "gpu", "apple", "mlx"]

[project.urls]
Homepage = "https://github.com/jmamodeo/metal-kernels"
Repository = "https://github.com/jmamodeo/metal-kernels"

# Optional hosts. The loader does not import them.
# mlx publishes Apple silicon wheels. PyTorch MPS is macOS-only.
[project.optional-dependencies]
mlx = ["mlx"]
torch = ["torch"]
reference = ["numpy>=1.24"]
dev = ["numpy>=1.24", "pytest>=7"]
# Mac-only. mlx and the default PyTorch wheel have no Linux MPS build.
mac = ["torch", "mlx"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
