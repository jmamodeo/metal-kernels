[pytest]
testpaths = tests
pythonpath =
    python/src
    .
addopts = -ra
markers =
    metal: kernel execution test; skipped when no Metal device is available
norecursedirs =
    .*
    build
    dist
    CVS
    _darcs
    {arch}
    *.egg
    *.egg-info
    .build
    .venv
    venv
    __pycache__
