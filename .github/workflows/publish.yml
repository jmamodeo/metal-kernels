name: Publish to PyPI

# Runs when a GitHub release is published. The PyPI project is metal-kernels.
# PyPI trusted publishing (OIDC) signs the upload, so no token is stored in
# this repository. On PyPI, the trusted publisher is: owner jmamodeo,
# repository metal-kernels, workflow publish.yml, environment pypi.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('python/pyproject.toml').read_text())['project']['version'])")"
          test "$TAG" = "v$version" || { echo "Tag $TAG does not match version $version"; exit 1; }

      - name: Build sdist and wheel
        working-directory: python
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install build twine
          python3 -m build
          python3 -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/metal-kernels/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
